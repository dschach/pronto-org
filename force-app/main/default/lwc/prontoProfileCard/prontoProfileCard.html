<template>
	<div class={themeClass}>
		<!-- Hero Image -->
		<div class="hero-container">
			<img src={heroImageUrl} alt="Profile background" class="hero-image" />
		</div>

		<!-- Card Body -->
		<div class="card-content">
			<!-- Record Headline -->
			<div class="slds-size_1-of-1 slds-p-bottom_small slds-p-left_small slds-p-right_small">
				<div class="record-headline slds-border_bottom prontoProfileCard-borderBottom">
					<div class="record-heading">
						<strong>{displayName}</strong>
					</div>
					<div>{headlineSubtitle}</div>
				</div>
			</div>

			<!-- Account States -->
			<template if:true={isAccount}>
				<!-- Partner Account -->
				<template if:true={isPartnerAccount}>
					<!-- Account Information -->
					<div class="slds-size_1-of-1 slds-p-around_small prontoProfileCard-pAroundSmall">
						<div class="slds-grid slds-wrap slds-border_bottom prontoProfileCard-borderBottom">
							<div class="slds-size_1-of-1 slds-grid slds-wrap">
								<div class="slds-align-middle icon-heading">
									<lightning-icon
										icon-name="utility:company"
										size="x-small"
										class="insight-icon slds-p-right_x-small"
										variant="inverse"></lightning-icon>
								</div>
								<div class="slds-align-middle section-heading">
									<strong>Account Information</strong>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel">Record Type</span>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{accountRecordType}</strong>
									</div>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel"
									>Account Number</span
								>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{accountNumber}</strong>
									</div>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel">Type</span>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{accountType}</strong>
									</div>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel">Employees</span>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{accountEmployees}</strong>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- Account Insights -->
					<div class="slds-size_1-of-1 slds-p-around_small prontoProfileCard-pAroundSmall">
						<div class="slds-grid slds-wrap slds-border_bottom prontoProfileCard-borderBottom">
							<div class="slds-size_1-of-1 slds-grid slds-wrap">
								<div class="slds-align-middle icon-heading">
									<lightning-icon
										icon-name="utility:data_cloud"
										size="x-small"
										class="insight-icon slds-p-right_x-small"
										variant="inverse"></lightning-icon>
								</div>
								<div class="slds-align-middle section-heading">
									<strong>Account Insights</strong>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel">Total Orders</span>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{accountTotalOrders}</strong>
									</div>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel"
									>Annual Sales Total</span
								>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{accountAnnualSalesTotal}</strong>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- Company Information -->

							<div class="slds-size_1-of-1 slds-grid slds-wrap">
								<div class="slds-align-middle icon-heading">
									<lightning-icon

										size="x-small"
										class="insight-icon slds-p-right_x-small"
										variant="inverse"></lightning-icon>
								</div>
								<div class="slds-align-middle section-heading">
									<strong>Company Information</strong>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel"
									>Annual Revenue</span
								>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">
										<strong>{formattedAccountRevenue}</strong>
									</div>
								</div>
							</div>
							<div class="slds-size_1-of-2 slds-p-bottom_small">
								<span class="slds-form-element__label font-color-white prontoProfileCard-formLabel"
									>Number of Locations</span
								>
								<div class="slds-form-element__control">
									<div class="slds-form-element__static font-color-white prontoProfileCard-formStatic">

							<div class="slds-size_1-of-2 slds-p-bottom_small">

							<div class="slds-size_1-of-1 slds-grid slds-wrap">
								<div class="slds-align-middle icon-heading">

							<div class="slds-size_1-of-2 slds-p-bottom_small">
